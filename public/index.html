<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7fb">
    <title>stock12 삼선전환도</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="brand"><strong>stock12</strong></div>
        <div class="source-indicator" id="sourceIndicator" title="시세 제공처 확인 중"><i></i><span>확인 중</span></div>
        <div class="market-summary" id="marketSummary" aria-label="시장 요약"></div>
        <div class="session-toggle" aria-label="한국 시장 구분">
          <button type="button" class="session-button active" data-mode="KRX">KRX</button>
          <button type="button" class="session-button" data-mode="NTX">NXT</button>
        </div>
      </header>
      <main class="chart-grid" id="chartGrid"></main>
    </div>

    <template id="chart-card-template">
      <section class="chart-card">
        <div class="card-controls" aria-label="차트 설정">
          <div class="timeframe-buttons"></div>
          <div class="chart-type-buttons" aria-label="차트 유형"></div>
          <label class="period-control"><span>조회기간</span><input class="period-input" type="number" min="20" max="700" value="120"></label>
        </div>
        <div class="chart-overlay">
          <div class="symbol-block">
            <div class="symbol-search"><input class="symbol-input" type="search" autocomplete="off" spellcheck="false" aria-label="종목 검색"><div class="suggestions" role="listbox"></div></div>
            <span class="symbol-code">티커 --</span>
          </div>
          <div class="quote-legend"><strong class="last-price">--</strong><span class="last-change">--</span><span class="market-status">--</span></div>
        </div>
        <canvas class="linebreak-canvas" aria-label="삼선전환도"></canvas>
        <div class="chart-note">삼선전환도 · MACD 양수 <i class="positive"></i> 음수 <i class="negative"></i></div>
        <div class="signal-alert" role="alert" aria-live="polite">
          <span class="signal-alert-title"></span>
          <span class="signal-alert-message"></span>
          <button type="button">확인</button>
        </div>
        <div class="loading">불러오는 중</div>
      </section>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
