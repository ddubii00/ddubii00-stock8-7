<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>stock8 - 주식 차트</title>
    <link rel="stylesheet" href="/stock8-7/styles.css">
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="market-summary" id="marketSummary" aria-label="시장 요약" tabindex="0" title="공간이 부족하면 좌우로 스크롤해 나머지 지수를 확인하세요"></div>
        <div class="header-actions">
          <span id="saveStatus" class="save-status" role="status" hidden></span>
          <div class="navigation-controls">
            <button type="button" id="layoutButton" title="현재 2x2 (가로 × 세로). 클릭하면 1x3, 3x1 순으로 변경">배치</button>
            <button type="button" id="nextButton" title="다음 차트 페이지 (5장 순환)">다음</button>
            <span id="pageIndicator" aria-live="polite">1 / 5</span>
          </div>
          <div class="feature-toggle" aria-label="전체 차트 설정">
            <button type="button" class="chart-toggle active" data-feature="bb" aria-pressed="true" title="전체 차트 볼린저밴드 표시/숨김 (20기간, 2 표준편차)">BB</button>
            <button type="button" class="chart-toggle" data-feature="weekly" aria-pressed="false" title="전체 주봉 전환. 끄면 이전 주기로 복원 (개별 봉 선택 가능)">주</button>
            <button type="button" class="chart-toggle" data-feature="line-break" aria-pressed="false" title="전체 삼선전환도 표시/해제. 이평선과 BB는 전환선 기준으로 계산">삼선</button>
          </div>
          <div class="session-toggle" aria-label="시장 데이터 모드">
            <button type="button" class="session-button active" data-mode="KRX">KRX</button>
            <button type="button" class="session-button" data-mode="NTX">NTX</button>
          </div>
        </div>
      </header>
      <main class="chart-grid" id="chartGrid" data-layout="2x2"></main>
    </div>

    <template id="chart-card-template">
      <section class="chart-card">
        <canvas class="macd-bg" aria-label="MACD 배경"></canvas>
        <div class="chart-stage" aria-label="주가 차트. 오른쪽 가격 눈금을 위아래로 드래그하면 Y축 범위 조절, 더블클릭하면 자동 범위 복원"></div>
        <div class="card-controls" aria-label="차트 설정">
          <div class="symbol-block">
            <div class="symbol-search">
              <input class="symbol-input" type="search" autocomplete="off" spellcheck="false" aria-label="종목 검색">
              <div class="suggestions" role="listbox"></div>
            </div>
          </div>
          <div class="timeframe-buttons"></div>
          <label class="period-control">
            <span>조회기간</span>
            <input class="period-input" type="number" min="20" max="700" value="120">
          </label>
        </div>
        <div class="chart-overlay">
          <div class="quote-tools" role="group" aria-label="주가, 이평선 범례와 선 도구">
            <div class="ohlc-legend">
              <span class="last-price">--</span>
              <span class="last-change">--</span>
              <span class="market-status">--</span>
            </div>
            <div class="ma-legend">
              <button type="button" data-series="candle"><i class="candle-swatch"></i><span class="candle-label">캔들</span></button>
              <button type="button" data-series="ma5"><i class="ma5"></i>5</button>
              <button type="button" data-series="ma10"><i class="ma10"></i>10</button>
              <button type="button" data-series="ma20"><i class="ma20"></i>20</button>
              <button type="button" data-series="ma60"><i class="ma60"></i>60</button>
              <button type="button" data-series="ma120"><i class="ma120"></i>120</button>
              <button type="button" data-series="ma200"><i class="ma200"></i>200</button>
              <button type="button" data-series="bb" title="이 차트만 볼린저밴드 표시/숨김"><i class="bb-swatch"></i>BB</button>
              <span class="trend-toolbar" role="group" aria-label="선 그리기">
                <button type="button" class="draw-line" aria-pressed="false" title="누른 뒤 차트의 시작점부터 끝점까지 드래그. 같은 종목의 다른 페이지에도 공유됩니다">선</button>
                <button type="button" class="delete-line" disabled title="선택한 선 삭제. 선택하지 않았으면 이 종목의 모든 선 삭제">선 삭제</button>
                <button type="button" class="line-width" disabled title="선택한 선의 굵기 1 → 2 → 3">굵기</button>
              </span>
            </div>
          </div>
        </div>
        <div class="price-tooltip" role="tooltip"></div>
        <div class="loading">불러오는 중</div>
      </section>
    </template>

    <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="/stock8-7/app.js" type="module"></script>
  </body>
</html>
